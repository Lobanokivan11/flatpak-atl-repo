name: Build and Host Flatpak Repo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-baseapp:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    outputs:
      has_baseapp: "true"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Flatpak Builder Cache
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder/
            ~/.ccache
          key: ${{ runner.os }}-flatpak-${{ hashFiles('io.gitlab.android_translation_layer.BaseApp.yml') }}
          restore-keys: |
            ${{ runner.os }}-flatpak-
      - name: Build BaseApp Dependency (Direct CLI)
        run: |
          mkdir -p .flatpak-builder
          flatpak-builder \
            --repo=baseapp_repo \
            --force-clean \
            --state-dir=.flatpak-builder \
            --default-branch=stable \
            --arch=x86_64 \
            --ccache \
            build_dir_baseapp \
            io.gitlab.android_translation_layer.BaseApp.yml
        env:
          GPG_TTY: /dev/null
      - name: Upload BaseApp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseapp-core-package
          path: baseapp_repo/
          retention-days: 1
  find-manifests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Find all YML manifests
        id: set-matrix
        run: |
          MANIFESTS=$(find . -maxdepth 1 -name "*.yml" ! -name "*BaseApp*" -printf '"%P", ' | sed 's/, $//')
          echo "matrix=[$MANIFESTS]" >> $GITHUB_OUTPUT

  build-flatpak:
    needs: [build-baseapp, find-manifests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manifest: ${{ fromJson(needs.find-manifests.outputs.matrix) }}
      fail-fast: false
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Import GPG Key for Manifest Reference
        id: import_gpg
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5}')
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
          gpg --export --armor $KEY_ID > repo.gpg
          gpg --export --armor $KEY_ID > /tmp/atl-repo.gpg
      - name: Download Fresh Local BaseApp
        uses: actions/download-artifact@v4
        with:
          name: baseapp-core-package
          path: local_atl_repo
      - name: Add Local ATL Repo with High Priority
        run: |
          flatpak build-update-repo local_atl_repo
          flatpak remote-add --user --if-not-exists --no-gpg-verify atl-repo-local local_atl_repo/
          flatpak remote-modify --user --prio=10 atl-repo-local
          flatpak remote-add --system --if-not-exists --no-gpg-verify atl-repo-local local_atl_repo/
          flatpak remote-modify --system --prio=10 atl-repo-local
      - name: Setup Flatpak Builder Cache
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder/
            ~/.ccache
          key: ${{ runner.os }}-flatpak-${{ matrix.manifest }}
          restore-keys: |
            ${{ runner.os }}-flatpak-
      - name: Build Flatpak App (Forced Local BaseApp)
        run: |
          mkdir -p .flatpak-builder
          flatpak-builder \
            --repo=public_repo \
            --force-clean \
            --state-dir=.flatpak-builder \
            --default-branch=stable \
            --arch=x86_64 \
            --ccache \
            --extra-collection-id \
            --local-packages=local_atl_repo \
            build_dir \
            ${{ matrix.manifest }}
        env:
          GPG_TTY: /dev/null


      - name: Upload Temporary Repo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-${{ strategy.job-index }}
          path: public_repo/
          retention-days: 1

  merge-and-sign:
    needs: [build-baseapp, build-flatpak]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Download BaseApp
        uses: actions/download-artifact@v4
        with:
          name: baseapp-core-package
          path: all_artifacts/baseapp
      - name: Download All Repo Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          pattern: flatpak-repo-*
      - name: Import Protected GPG Key for Final Signing
        id: import_gpg
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye
          gpgconf --kill gpg-agent
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5}')
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
          gpg --export --armor $KEY_ID > /tmp/atl-repo.gpg

      - name: Prime GPG Agent Cache
        run: |
          echo "prime_cache" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --local-user ${{ steps.import_gpg.outputs.key_id }} \
            --sign > /dev/null

      - name: Combine and Rebuild Repository Index
        run: |
          mkdir combined_repo
          ostree --repo=combined_repo init --mode=archive
          if [ -d "all_artifacts/baseapp" ]; then
            echo "Merging BaseApp into final repository..."
            cp -uR all_artifacts/baseapp/* combined_repo/ || true
          fi
          for folder in all_artifacts/flatpak-repo-*/; do
            if [ -d "$folder" ]; then
              echo "Importing apps from $folder..."
              cp -uR "$folder"/* combined_repo/ || true
            fi
          done
          flatpak build-update-repo --gpg-sign=${{ steps.import_gpg.outputs.key_id }} combined_repo

      - name: Export Public Key
        run: |
          gpg --export --armor ${{ steps.import_gpg.outputs.key_id }} > combined_repo/repo.gpg

      - name: Create Flatpakrepo File
        run: |
          GPG_BASE64=$(gpg --export ${{ steps.import_gpg.outputs.key_id }} | base64 | tr -d '\n')
          cat <<EOF > combined_repo/atl-repo.flatpakrepo
          [Flatpak Repo]
          Title=Android Translation Layer Apps
          Url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          Homepage=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}
          Comment=A Custom Repository with Android Translation Layer Apps
          Description=A Custom Repository with Android Translation Layer Apps
          GPGVerify=true
          GPGVerifySummary=true
          GPGKey=$GPG_BASE64
          EOF

      - name: Upload Final Repo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-combined-repo
          path: combined_repo/
          retention-days: 1

  publish-pages:
    needs: merge-and-sign
    runs-on: ubuntu-latest
    steps:
      - name: Download Final Combined Repo
        uses: actions/download-artifact@v4
        with:
          name: final-combined-repo
          path: ./combined_repo

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './combined_repo'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
