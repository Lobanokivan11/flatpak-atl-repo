name: Build and Host Flatpak Repo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  find-manifests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Find all YML manifests
        id: set-matrix
        run: |
          MANIFESTS=$(find . -maxdepth 1 -name "*.yml" -printf '"%P", ' | sed 's/, $//')
          echo "matrix=[$MANIFESTS]" >> $GITHUB_OUTPUT

  build-flatpak:
    needs: find-manifests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manifest: ${{ fromJson(needs.find-manifests.outputs.matrix) }}
      fail-fast: false
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Import GPG Key for Manifest Reference
        id: import_gpg
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5}')
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
          gpg --export --armor $KEY_ID > repo.gpg
          gpg --export --armor $KEY_ID > /tmp/atl-repo.gpg

      - name: Add Custom Remote Repository with GPG
        run: |
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          flatpak remote-add --user --if-not-exists --no-gpg-verify atl-repo $REPO_URL
          flatpak remote-modify --user --prio=10 atl-repo

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ matrix.manifest }}
          cache-key: flatpak-builder-${{ matrix.manifest }}-${{ github.sha }}
          build-bundle: false
          repo-dir: public_repo
        env:
          GPG_TTY: /dev/null

      - name: Upload Temporary Repo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-${{ strategy.job-index }}
          path: public_repo/
          retention-days: 1

  merge-and-sign:
    needs: build-flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Repo Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          pattern: flatpak-repo-*
      - name: Import Protected GPG Key for Final Signing
        id: import_gpg
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye
          gpgconf --kill gpg-agent
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5}')
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
          gpg --export --armor $KEY_ID > /tmp/atl-repo.gpg

      - name: Prime GPG Agent Cache
        run: |
          echo "prime_cache" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --local-user ${{ steps.import_gpg.outputs.key_id }} \
            --sign > /dev/null

      - name: Combine and Rebuild Repository Index
        run: |
          mkdir combined_repo
          ostree --repo=combined_repo init --mode=archive
          for folder in all_artifacts/flatpak-repo-*/; do
            if [ -d "$folder" ]; then
              echo "Importing apps from $folder..."
              cp -uR "$folder"/* combined_repo/ || true
            fi
          done
          flatpak build-update-repo combined_repo

      - name: Export Public Key
        run: |
          gpg --export --armor ${{ steps.import_gpg.outputs.key_id }} > combined_repo/repo.gpg

      - name: Create Flatpakrepo File
        run: |
          GPG_BASE64=$(gpg --export ${{ steps.import_gpg.outputs.key_id }} | base64 | tr -d '\n')
          cat <<EOF > combined_repo/atl-repo.flatpakrepo
          [Flatpak Repo]
          Title=Android Translation Layer Apps
          Url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          Homepage=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}
          Comment=A Custom Repository with Android Translation Layer Apps
          Description=A Custom Repository with Android Translation Layer Apps
          GPGVerify=false
          GPGVerifySummary=false
          EOF

      - name: Upload Final Repo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-combined-repo
          path: combined_repo/
          retention-days: 1

  publish-pages:
    needs: merge-and-sign
    runs-on: ubuntu-latest
    steps:
      - name: Download Final Combined Repo
        uses: actions/download-artifact@v4
        with:
          name: final-combined-repo
          path: ./combined_repo

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './combined_repo'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
